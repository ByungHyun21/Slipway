[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slipway"
version = "0.1.0"
description = "Per-project artifact manager between AI generation pipelines and game engines"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
slip = "slipway.cli:main"

[tool.setuptools.packages.find]
include = ["slipway*"]

[tool.setuptools.package-data]
slipway = ["static/*"]
